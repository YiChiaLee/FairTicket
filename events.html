<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Events | FairTicket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar inner-nav">
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">
      <span class="logo-icon">▦</span>
      <span>FairTicket</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a class="active" href="events.html">Events</a>
      <a href="how.html">How It Works</a>
      <a href="#">⚙ Admin</a>
      <button class="nav-btn">Get Tickets</button>
    </nav>
  </header>

  <section class="page-hero">
    <p class="eyebrow">BROWSE</p>
    <h1>All Events</h1>
    <p>Find your event and enter the fair lottery.</p>
  </section>

  <main class="events-page">
    <div class="toolbar">
      <label class="search-box">
        <span>⌕</span>
        <input id="eventSearch" type="search" placeholder="Search events or venues..." />
      </label>
      <span class="filter-icon">⌘</span>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="All">All</button>
        <button class="chip" data-filter="Concert">Concert</button>
        <button class="chip" data-filter="Sports">Sports</button>
        <button class="chip" data-filter="Theater">Theater</button>
        <button class="chip" data-filter="Festival">Festival</button>
        <button class="chip" data-filter="Other">Other</button>
      </div>
    </div>

    <div id="allEventGrid" class="event-grid"></div>
  </main>

  <script src="events.js"></script>
</body>
</html>
